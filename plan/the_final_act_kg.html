<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {

  }

  #header {

    flex-wrap: wrap;

    gap: 8px;
    flex-wrap: wrap;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
  }
  .btn {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;

    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;

  #stat { font-size: 0.72rem; color: #94a3b8; }

  #main { flex: 1; min-height: 0; display: flex; }
  #network { flex: 1; background: #ffffff; }

  #sidebar {
    width: 320px;
    flex-shrink: 0;

  .nd-type { font-size: 0.72rem; color: #94a3b8; margin-bottom: 14px; }

    font-size: 0.68rem;
    font-weight: 600;

<script>
const KG_NODES = [{"id": "n_marcus", "name": "Marcus Vance", "labels": ["Character", "Victim"], "group": "Victim", "level": 2, "shape": "ellipse", "style": {"bg": "#e3e6ea", "border": "#64748b", "font": "#2d343f"}, "properties": {"role": "victim", "bio": "Marcus Vance, 54, is a celebrated but ruthless theatre director known for his exacting standards and complete disregard for the people around him. He built his career by exploiting those who depended on him — holding debts, secrets, and contracts over their heads. On the night of his death he was found slumped on the floor of his dressing room, struck by a brass candlestick. The door was locked from the inside."}}, {"id": "n_elena", "name": "Elena Rostova", "labels": ["Character", "Suspect"], "group": "Suspect", "level": 2, "shape": "ellipse", "style": {"bg": "#fcf1e1", "border": "#f0b35a", "font": "#6c5128"}, "properties": {"role": "suspect", "guilty": true, "bio": "Elena Rostova, 34, is the lead actress of 'Shadows of Guilt'. Born in St. Petersburg, she rose quickly to prominence — but her gambling debts followed her. Two years ago, Marcus quietly purchased her debt contracts, transforming himself into her controller. Composed and precise on stage, she is brittle and calculating off it.", "tags": ["composed", "calculating", "deflects with charm", "precise under pressure", "hides panic behind poise"], "victim_connection": "Marcus held Elena's debt contracts and controlled every aspect of her professional and personal life for two years.", "motive": "Freedom. With Marcus dead, the debt contracts die with him.", "interrogation_style": "Calm and composed. Deflects with charm. Steers suspicion toward Julian's letter or Leo's dismissal. If asked about the ventilation shaft, the candlestick, or the compact mirror, become visibly anxious and redirect immediately. Never acknowledge entering the shaft or striking Marcus."}}, {"id": "n_julian", "name": "Dr. Julian Wilde", "labels": ["Character", "Suspect"], "group": "Suspect", "level": 2, "shape": "ellipse", "style": {"bg": "#fcf1e1", "border": "#f0b35a", "font": "#6c5128"}, "properties": {"role": "suspect", "guilty": false, "bio": "Dr. Julian Wilde, 52, presents himself as a respected physician and patron of the arts. In reality, his medical credentials were purchased from an unaccredited institution fifteen years ago. He has poured significant funds into the Meridian Theatre. Three months ago, Marcus stumbled upon evidence of the fraudulent qualifications and began extracting money.", "tags": ["authoritative", "verbose", "sweats under direct questioning", "name-drops frequently", "defensive about credentials"], "victim_connection": "Marcus discovered Julian's fabricated medical credentials and was blackmailing him for cash payments in exchange for silence.", "motive": "Marcus had escalating financial demands. Julian was running out of patience and money.", "interrogation_style": "Authoritative and slightly condescending. Volunteers his whereabouts quickly. Becomes evasive only when questioned about the torn letter or his credentials. Redirects suspicion toward Leo."}}, {"id": "n_leo", "name": "Leo Cross", "labels": ["Character", "Suspect"], "group": "Suspect", "level": 2, "shape": "ellipse", "style": {"bg": "#fcf1e1", "border": "#f0b35a", "font": "#6c5128"}, "properties": {"role": "suspect", "guilty": false, "bio": "Leo Cross, 43, has worked as a stagehand in theatre for over twenty years. He joined the Meridian crew eight months ago. That morning, Marcus berated him in front of the full crew over a minor prop placement error and fired him on the spot. Despite having his pass revoked, Leo showed up that evening to see the opening night of the show he had helped build.", "tags": ["blunt", "emotional", "loyal to crew", "no filter", "obviously angry but honest"], "victim_connection": "Marcus fired Leo without warning that morning after a trivial dispute, ending eight months of work.", "motive": "Anger and humiliation over wrongful termination.", "interrogation_style": "Blunt and defensive. Admits anger openly but insists on his account without hesitation. Gets frustrated if pressed. Not smooth enough to be a convincing liar — which is why he isn't one."}}, {"id": "n_candlestick", "name": "Brass Candlestick", "labels": ["Item", "MurderWeapon"], "group": "MurderWeapon", "level": 3, "shape": "triangle", "style": {"bg": "#f4d8f7", "border": "#c026d3", "font": "#56115f"}, "properties": {"description": "A heavy brass candlestick from Marcus's dressing room desk, found on the floor beside the body. One end is bloodied.", "significance": "The murder weapon. Someone struck Marcus with considerable force. The bloodied end was found facing the desk."}}, {"id": "n_torn_letter", "name": "Torn Letter", "labels": ["Item", "Evidence"], "group": "Evidence", "level": 3, "shape": "triangle", "style": {"bg": "#fbf1d3", "border": "#eab308", "font": "#695104"}, "properties": {"description": "Several torn pieces of paper found in Marcus's bin, reassembled. An angry warning signed with the initials J.W., threatening to expose the blackmail. References a fraudulent medical licence.", "significance": "Written by Julian Wilde. The initials and content point directly to him — but whether he had opportunity is still unclear."}}, {"id": "n_silver_compact", "name": "Silver Compact Mirror", "labels": ["Item", "Evidence"], "group": "Evidence", "level": 3, "shape": "triangle", "style": {"bg": "#fbf1d3", "border": "#eab308", "font": "#695104"}, "properties": {"description": "A small silver makeup compact, engraved with the initials E.R. Found inside the ventilation shaft, roughly halfway between Elena's dressing room and Marcus's.", "significance": "Someone dropped this inside the shaft. The initials suggest its owner — but ownership alone does not place them at the scene at the time of the murder."}}, {"id": "n_vent_grate", "name": "Ventilation Grate", "labels": ["Item", "Evidence"], "group": "Evidence", "level": 3, "shape": "triangle", "style": {"bg": "#fbf1d3", "border": "#eab308", "font": "#695104"}, "properties": {"description": "The grate covering the vent entrance in Marcus's dressing room was found unscrewed and leaning against the wall. Screwdriver marks on the frame are old, suggesting prior tampering.", "significance": "The screwdriver marks on the frame are old — this was loosened deliberately, and not recently. Someone planned ahead."}}, {"id": "n_locked_door", "name": "Locked Door", "labels": ["Item", "Evidence"], "group": "Evidence", "level": 3, "shape": "triangle", "style": {"bg": "#fbf1d3", "border": "#eab308", "font": "#695104"}, "properties": {"description": "The dressing room door was locked from the inside with a deadbolt during intermission. The only key was found in Marcus's jacket pocket. No signs of forced entry on the door.", "significance": "No forced entry. The door was bolted from inside and the key was on the body. How did the killer get in — and out?"}}, {"id": "n_dressing_room", "name": "Marcus's Dressing Room", "labels": ["Location", "CrimeScene"], "group": "CrimeScene", "level": 0, "shape": "diamond", "style": {"bg": "#eae2fd", "border": "#8b5cf6", "font": "#3f296f"}, "properties": {"description": "Private room backstage. Locked from inside with no forced entry. Contains desk, bloodied brass candlestick on the floor, torn letter in the bin, unsealed ventilation grate."}}, {"id": "n_vent_shaft", "name": "Ventilation Shaft", "labels": ["Location", "EscapeRoute"], "group": "EscapeRoute", "level": 0, "shape": "diamond", "style": {"bg": "#d4f2e8", "border": "#10b981", "font": "#07533a"}, "properties": {"description": "Narrow shaft running behind the backstage wall. Connects Elena's dressing room to Marcus's via the backstage corridor."}}, {"id": "n_elena_room", "name": "Elena's Dressing Room", "labels": ["Location"], "group": "Location", "level": 0, "shape": "diamond", "style": {"bg": "#d7f5e2", "border": "#22c55e", "font": "#0f592a"}, "properties": {"description": "Adjacent to Marcus's room. The vent shaft entrance is here. Elena was seen here during intermission by guests."}}, {"id": "n_lobby", "name": "Theatre Lobby", "labels": ["Location"], "group": "Location", "level": 0, "shape": "diamond", "style": {"bg": "#d7f5e2", "border": "#22c55e", "font": "#0f592a"}, "properties": {"description": "Public foyer. Julian Wilde was here with investors Barton and Finch during the entire intermission."}}, {"id": "n_bar", "name": "Theatre Bar", "labels": ["Location"], "group": "Location", "level": 0, "shape": "diamond", "style": {"bg": "#d7f5e2", "border": "#22c55e", "font": "#0f592a"}, "properties": {"description": "Ground-floor bar. Leo Cross was here from 8:00 PM onward, confirmed by bartender Tommy Reeves."}}, {"id": "n_stage", "name": "Stage", "labels": ["Location"], "group": "Location", "level": 0, "shape": "diamond", "style": {"bg": "#d7f5e2", "border": "#22c55e", "font": "#0f592a"}, "properties": {"description": "Main performance space. Elena was visible here throughout Act 1 (7:15 PM – 9:00 PM)."}}, {"id": "n_stalls", "name": "Front Row Stalls", "labels": ["Location"], "group": "Location", "level": 0, "shape": "diamond", "style": {"bg": "#d7f5e2", "border": "#22c55e", "font": "#0f592a"}, "properties": {"description": "The front row of the audience seating area. Julian sat here during Act 1 and was visible to many audience members."}}, {"id": "n_meridian_theatre", "name": "Meridian Theatre", "labels": ["Place"], "group": "Place", "level": 0, "shape": "diamond", "style": {"bg": "#f2d9ec", "border": "#b82e95", "font": "#531543"}, "properties": {}}, {"id": "n_shadows_of_guilt", "name": "Shadows of Guilt", "labels": ["Work", "Play"], "group": "Play", "level": 3, "shape": "triangle", "style": {"bg": "#e0d9f2", "border": "#532eb8", "font": "#251553"}, "properties": {}}, {"id": "n_backstage", "name": "Backstage", "labels": ["Location"], "group": "Location", "level": 0, "shape": "diamond", "style": {"bg": "#d7f5e2", "border": "#22c55e y": [], "provenance": "discoverable_evidence", "color": "#9333ea", "properties": {"player_discovery": {"method": "examine_location", "target": "n_bar"}}}, {"id": "e128", "from": "n_leo", "to": "n_three_rounds", "rel": "BOUGHT", "hidden": false, "knownBy": ["n_leo"], "provenance": "self_knowledge", "color": "#16a34a", "properties": {"time": "8:00 PM - 10:00 PM"}}, {"id": "e129", "from": "n_three_rounds", "to": "n_cash", "rel": "PAID_WITH", "hidden": false, "knownBy": [], "provenance": "discoverable_evidence", "color": "#9333ea", "properties": {"player_discovery": {"method": "examine_location", "target": "n_bar"}}}, {"id": "e130", "from": "n_leo", "to": "n_bar", "rel": "DID_NOT_LEAVE", "hidden": false, "knownBy": [], "provenance": "discoverable_evidence", "color": "#9333ea", "properties": {"time": "8:00 PM - 10:00 PM", "player_discovery": {"method": "examine_location", "target": "n_bar"}}}, {"id": "e131", "from": "n_leo", "to": "ev_backstage_pass_revoked", "rel": "PARTICIPATED_IN", "hidden": false, "knownBy": ["n_leo"], "provenance": "self_knowledge", "color": "#16a34a", "properties": {"time": "8:00 PM"}}, {"id": "e132", "from": "ev_backstage_pass_revoked", "to": "n_backstage_pass", "rel": "REVOKED", "hidden": false, "knownBy": ["n_leo"], "provenance": "self_knowledge", "color": "#16a34a", "properties": {}}, {"id": "e133", "from": "n_backstage_pass", "to": "n_backstage", "rel": "GRANTED_ACCESS_TO", "hidden": false, "knownBy": ["n_leo"], "provenance": "self_knowledge", "color": "#16a34a", "properties": {}}, {"id": "e134", "from": "ev_backstage_pass_revoked", "to": "n_dressing_room", "rel": "PREVENTED_ACCESS_TO", "hidden": false, "knownBy": ["n_leo"], "provenance": "self_knowledge", "color": "#16a34a", "properties": {}}, {"id": "e135", "from": "ev_leo_bar_presence", "to": "ev_murder", "rel": "OVERLAPPED_WITH", "hidden": false, "knownBy": ["n_leo"], "provenance": "self_knowledge", "color": "#16a34a", "properties": {}}, {"id": "e136", "from": "n_candlestick", "to": "n_floor", "rel": "FOUND_ON", "hidden": false, "knownBy": "all", "provenance": "public_report", "color": "#64748b", "properties": {}}, {"id": "e137", "from": "n_candlestick", "to": "n_body", "rel": "FOUND_BESIDE", "hidden": false, "knownBy": "all", "provenance": "public_report", "color": "#64748b", "properties": {}}];

const nodeById = {};
KG_NODES.forEach(n => nodeById[n.id] = n);

let allNodes = KG_NODES.map(n => ({
  id: n.id,
  label: n.name,
  shape: n.shape,
  color: {
    background: n.style.bg,
    border: n.style.border,
    highlight: { background: n.style.bg, border: n.style.border },
  },
  font: { color: n.style.font, size: 13 },
  borderWidth: 2,
  margin: 8,
}));

let allEdges = KG_EDGES.map(e => ({
  id: e.id,
  from: e.from,
  to: e.to,
  label: e.id + ": " + e.rel,
  color: { color: e.color, highlight: "#0f172a" },
  font: { color: e.color, size: 10, strokeWidth: 4, strokeColor: "#ffffff", align: "middle" },
  arrows: { to: { enabled: true, scaleFactor: 0.6 } },
  dashes: e.hidden,
  width: e.hidden ? 2.5 : 1.4,
  smooth: { type: "curvedCW", roundness: 0.15 },
}));

const nodes = new vis.DataSet(allNodes);
const edges = new vis.DataSet(allEdges);

const container = document.getElementById("network");
const network = new vis.Network(container, { nodes, edges }, {
  physics: {
    solver: "forceAtlas2Based",
    forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.006, springLength: 150, springConstant: 0.05, damping: 0.35 },
    stabilization: { iterations: 250 },
  },
  interaction: { hover: true, tooltipDelay: 100 },
  layout: { improvedLayout: true },
});
network.once("stabilizationIterationsDone", function() {
  network.setOptions({ physics: { enabled: false } });
});

// ===== FILTERING =====
let currentFilter = { mode: "all", value: "" };

function knownByMatches(knownBy, suspectId) {
  if (knownBy === "all") return true;
  if (Array.isArray(knownBy)) return knownBy.includes(suspectId);
  return knownBy === suspectId;
}

function render() {
  const showHidden = document.getElementById("toggle-hidden").checked;
  const includeDiscoverable = document.getElementById("toggle-discoverable").checked;

  let visibleEdgeIds;
  if (currentFilter.mode === "suspect") {
    visibleEdgeIds = new Set(KG_EDGES.filter(e => {
      if (e.hidden && !showHidden) return false;
      const known = knownByMatches(e.knownBy, currentFilter.value);
      const discoverable = includeDiscoverable && e.provenance === "discoverable_evidence";
      return known || discoverable;
    }).map(e => e.id));
  } else {
    visibleEdgeIds = new Set(KG_EDGES.filter(e => showHidden || !e.hidden).map(e => e.id));
  }

  let visibleNodeIds;
  if (currentFilter.mode === "level") {
    visibleNodeIds = new Set(KG_NODES.filter(n => n.level === currentFilter.value).map(n => n.id));
    visibleEdgeIds = new Set([...visibleEdgeIds].filter(id => {
      const e = KG_EDGES.find(x => x.id === id);
      return visibleNodeIds.has(e.from) && visibleNodeIds.has(e.to);
    }));
  } else if (currentFilter.mode === "suspect") {
    visibleNodeIds = new Set([currentFilter.value]);
    KG_EDGES.forEach(e => {
      if (visibleEdgeIds.has(e.id)) { visibleNodeIds.add(e.from); visibleNodeIds.add(e.to); }
    });
  } else {
    visibleNodeIds = new Set(KG_NODES.map(n => n.id));
  }

  nodes.update(KG_NODES.map(n => ({ id: n.id, hidden: !visibleNodeIds.has(n.id) })));
  edges.update(KG_EDGES.map(e => ({ id: e.id, hidden: !visibleEdgeIds.has(e.id) })));
  document.getElementById("stat").textContent = `${visibleNodeIds.size} nodes / ${visibleEdgeIds.size} edges`;
}

function selectFilter(btn) {
  document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const level = btn.dataset.mode === "level" ? Number(btn.dataset.value) : btn.dataset.value;
  currentFilter = { mode: btn.dataset.mode, value: level };
  render();
}

// ===== SIDEBAR =====
function fmtValue(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

network.on("click", function(params) {
  if (params.nodes.length === 0) return;
  const n = nodeById[params.nodes[0]];
  const sidebar = document.getElementById("sidebar");

  const guiltyBadge = "guilty" in n.properties
    ? (n.properties.guilty
        ? '<span class="tag tag-guilty">犯人</span>'
        : '<span class="tag tag-innocent">無実</span>')
    : "";

  const desc = n.properties.bio || n.properties.description || "";
  const skipKeys = new Set(["bio", "description", "guilty"]);
  const propLines = Object.entries(n.properties)
    .filter(([k]) => !skipKeys.has(k))
    .map(([k, v]) => '<div class="nd-prop"><strong>' + k + ':</strong> ' + fmtValue(v) + '</div>')
    .join("");

  const connected = KG_EDGES.filter(e => e.from === n.id || e.to === n.id);
  const edgeHTML = connected.map(e => {
    const outgoing = e.from === n.id;
    const other = nodeById[outgoing ? e.to : e.from];
    const arrow = outgoing ? "&rarr;" : "&larr;";
    const metaBits = [];
    if (e.properties.time) metaBits.push(e.properties.time);
    if (e.provenance) metaBits.push(e.provenance);
    const metaStr = metaBits.length ? `<div class="meta">${metaBits.join(" / ")}</div>` : "";
    const hiddenStr = e.hidden ? '<div class="hidden-flag">🔴 探偵には隠蔽</div>' : "";
    const extra = Object.entries(e.properties)
      .filter(([k]) => k !== "time")
      .map(([k, v]) => `<div class="meta">${k}: ${fmtValue(v)}</div>`)
      .join("");
    return `<div class="nd-edge"><span class="eid">${e.id}</span> <span class="rel">${e.rel}</span> ${arrow} <span class="node">${other ? other.name : (outgoing ? e.to : e.from)}</span>${metaStr}${extra}${hiddenStr}</div>`;
  }).join("");

  sidebar.innerHTML = `
    <h2>詳細</h2>
    <div class="nd-label">${n.name}</div>
    <div class="nd-type">${n.labels.join(", ")}${guiltyBadge}</div>
    <div class="nd-section">
      <div class="nd-section-title">説明</div>
      <div class="nd-prop">${desc || "(説明なし)"}</div>
    </div>
    ${propLines ? `<div class="nd-section"><div class="nd-section-title">プロパティ</div>${propLines}</div>` : ""}
    <div class="nd-section">
      <div class="nd-section-title">関連エッジ（${connected.length}件）</div>
      ${edgeHTML || '<div class="nd-prop" style="color:#cbd5e1">なし</div>'}
    </div>
  `;
});

render();
</script>
